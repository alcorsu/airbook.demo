<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancelar reserva AIRBOOK</title>
  <meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="05_AIRBOOK_Isotipo2180.png">
<link rel="icon" type="image/png" sizes="192x192" href="05_AIRBOOK_Isotipo2192.png">
<meta name="theme-color" content="#0F172A">
<script src="config.js?v=3"></script>
<script src="api.js?v=1"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #0f172a;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 24px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(0,0,0,.25);
    }

    .logo { height: 90px; margin-bottom: 16px; }

    h2 { margin: 0 0 12px; font-size: 22px; }
    h2.ok { color: #16a34a; }
    h2.error { color: #dc2626; }

    p { color: #475569; font-size: 15px; line-height: 1.5; margin: 0 0 12px; }

    .detalle {
      text-align: left;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px 14px;
      margin: 14px 0;
      font-size: 14px;
      line-height: 1.7;
    }

    .detalle b { color: #0f172a; }

    .button {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 15px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      color: white;
      background: linear-gradient(135deg, #dc2626, #991b1b);
    }

    .button.secondary { background: #475569; font-size: 15px; font-weight: 700; }
    .button:disabled { opacity: .65; cursor: not-allowed; }
    .button:focus-visible { outline: 3px solid #38bdf8; outline-offset: 3px; }

    .footer { margin-top: 20px; color: #94a3b8; font-size: 12px; }
  </style>
</head>

<body>
  <div class="card">
    <img src="05_AIRBOOK_Isotipo512.png" class="logo" alt="AIRBOOK">

    <div id="contenido">
      <h2>Cancelar reserva</h2>
      <p>¿Confirmas que quieres cancelar esta reserva? El horario quedará libre para otros pilotos.</p>
      <button class="button" id="btnCancelar" type="button">Sí, cancelar mi reserva</button>
      <button class="button secondary" type="button" onclick="airbook.ir('dashboard')">No, volver a AIRBOOK</button>
    </div>

    <div class="footer">AIRBOOK · Gestión de reservas aeronáuticas</div>
  </div>

<script>
const contenido = document.getElementById("contenido");
const btn = document.getElementById("btnCancelar");
const id = new URLSearchParams(location.search).get("id") || "";

function linea(etiqueta, valor) {
  const div = document.createElement("div");
  const b = document.createElement("b");
  b.textContent = etiqueta + ": ";
  div.appendChild(b);
  div.appendChild(document.createTextNode(valor || "—"));
  return div;
}

function mostrarResultado(r) {
  contenido.innerHTML = "";

  const h2 = document.createElement("h2");
  h2.className = r.tipo === "ok" ? "ok" : "error";
  h2.textContent = (r.tipo === "ok" ? "✈️ " : "⚠️ ") + r.titulo;
  contenido.appendChild(h2);

  const p = document.createElement("p");
  p.textContent = r.mensaje || "";
  contenido.appendChild(p);

  if (r.detalle) {
    const box = document.createElement("div");
    box.className = "detalle";
    box.appendChild(linea("Avión", r.detalle.avion));
    box.appendChild(linea("Piloto", r.detalle.piloto));
    box.appendChild(linea("Inicio", r.detalle.inicio));
    box.appendChild(linea("Término", r.detalle.termino));
    contenido.appendChild(box);
  }

  if (r.club) {
    const club = document.createElement("p");
    club.textContent = r.club;
    contenido.appendChild(club);
  }

  const volver = document.createElement("button");
  volver.className = "button secondary";
  volver.type = "button";
  volver.textContent = "Ir a AIRBOOK";
  volver.onclick = function () { airbook.ir("dashboard"); };
  contenido.appendChild(volver);
}

if (!id) {
  mostrarResultado({
    tipo: "error",
    titulo: "Enlace inválido",
    mensaje: "El enlace no contiene un identificador de reserva. Usa el enlace del correo de confirmación."
  });
}

// Se pide confirmación antes de cancelar: así un antivirus o
// un lector de correo que abra el enlace no cancela la reserva solo.
btn && btn.addEventListener("click", function () {
  btn.disabled = true;
  btn.textContent = "Cancelando...";

  airbook.llamar("cancelarReserva", { id: id })
    .then(mostrarResultado)
    .catch(function (error) {
      mostrarResultado({
        tipo: "error",
        titulo: "No se pudo cancelar",
        mensaje: error.message + " Si el problema sigue, avisa al administrador de tu club."
      });
    });
});
</script>
</body>
</html>
